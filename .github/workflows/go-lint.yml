name: Go lint

on:
  push:

permissions:
  contents: read

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint Go code
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m ./...
